name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q --cov=src --cov-report=term-missing
      - name: Regenerate report
        run: python run_analysis.py > /dev/null && cat outputs/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Dashboard boots
        run: |
          streamlit run app.py --server.headless true --server.port 8501 &
          for i in $(seq 1 30); do curl -fs localhost:8501/_stcore/health && exit 0; sleep 1; done
          exit 1
